<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04050d" />
    <meta name="robots" content="noindex" />
    <meta name="application-name" content="SparkScribe" />
    <title>My Library — SparkScribe</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg-grid"></div><div class="bg-glow bg-glow-a"></div><div class="bg-glow bg-glow-b"></div><div class="bg-glow bg-glow-c"></div><div class="bg-noise"></div>
    </div>

    <header class="topbar">
      <a class="brand" href="/" aria-label="SparkScribe home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="brand-name">Spark<b>Scribe</b></span>
      </a>
      <div class="topbar-right"><div id="accountSlot"></div></div>
    </header>

    <main class="app">
      <section class="lib-head">
        <div>
          <div class="eyebrow mono"><span class="pulse"></span>your saved transcripts</div>
          <h1 class="page-title">My Library</h1>
          <p class="page-sub" id="libCount">Loading…</p>
        </div>
        <a class="btn btn-primary" href="/">New transcription</a>
      </section>

      <section class="lib-list" id="libList" aria-live="polite">
        <div class="lib-skel"></div><div class="lib-skel"></div><div class="lib-skel"></div>
      </section>
    </main>

    <footer class="foot mono">Saved transcripts are private to your account · audio is never uploaded</footer>
    <script type="module" src="/src/pages/library.js"></script>
  </body>
</html>
