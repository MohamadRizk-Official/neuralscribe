<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04050d" />
    <meta name="robots" content="noindex" />
    <meta name="application-name" content="SparkScribe" />
    <title>Transcript — SparkScribe</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg-grid"></div><div class="bg-glow bg-glow-a"></div><div class="bg-glow bg-glow-b"></div><div class="bg-glow bg-glow-c"></div><div class="bg-noise"></div>
    </div>

    <header class="topbar">
      <a class="brand" href="/" aria-label="SparkScribe home">
        <svg class="brand-mark spark-mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false"><defs><linearGradient id="sparkGrad" gradientUnits="userSpaceOnUse" x1="2" y1="0" x2="38" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs><rect class="sb sb-o" x="2" y="14" width="4" height="12" rx="2"/><rect class="sb sb-i" x="9" y="9" width="4" height="22" rx="2"/><path class="sbolt" d="M22.8 1.5 16 21.4h4l-2.8 17.1 6.8-20.9h-4.2z"/><path class="sbolt-hi" d="M22.8 1.5 16 21.4h4l-2.8 17.1 6.8-20.9h-4.2z"/><rect class="sb sb-i" x="27" y="10" width="4" height="20" rx="2"/><rect class="sb sb-o" x="34" y="15" width="4" height="10" rx="2"/></svg>
        <span class="brand-name">Spark<b>Scribe</b></span>
      </a>
      <div class="topbar-right"><div id="accountSlot"></div></div>
    </header>

    <main class="app">
      <a class="back-link" href="/library">← My Library</a>

      <section class="panel res-head" id="detailHead">
        <div class="res-title">
          <div class="title-row">
            <h2 id="tTitle">Loading…</h2>
            <button class="icon-btn" id="renameBtn" type="button" title="Rename" aria-label="Rename this recording" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg></button>
          </div>
          <div class="meta-chips" id="tMeta"></div>
          <div class="rec-folders" id="tFolders"></div>
        </div>
        <div class="res-actions hidden" id="tActions">
          <button class="btn btn-ghost star-btn" id="favBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9Z"/></svg><span>Favorite</span></button>
          <button class="btn btn-ghost" id="foldersBtn" type="button">Folders</button>
          <label class="btn btn-ghost" id="attachBtn" title="Open the original audio from this device to play along. It is not uploaded.">
            Play along
            <input type="file" id="attachInput" accept="audio/*,video/*,.m4a,.mp3,.mp4,.wav,.ogg,.opus,.webm,.aac,.flac,.mov" hidden />
          </label>
          <div class="btn-group">
            <button class="btn btn-ghost" id="copyBtn" type="button">Copy</button>
            <button class="btn btn-ghost" id="exportBtn" type="button">Export</button>
          </div>
          <button class="btn btn-danger" id="deleteBtn" type="button">Delete</button>
        </div>
      </section>

      <nav id="resTabs" aria-label="Result views"></nav>

      <section class="panel transcript-card" id="transcriptCard">
        <div class="view-toggle" role="group" aria-label="Transcript view" id="viewToggle">
          <button type="button" class="on" data-view="original" aria-pressed="true" title="Exactly as transcribed">Original</button>
          <button type="button" data-view="clean" aria-pressed="false" title="Easier to read: hesitations (um, uh) and repeated words removed. The original is kept.">Clean</button>
        </div>
        <div class="transcript" id="transcript"><div class="lib-skel"></div><div class="lib-skel"></div></div>
      </section>

      <div id="insightsHost" class="insights-host"></div>
    </main>

    <div class="attach-bar hidden" id="attachBar">
      <audio id="attachPlayer" controls preload="metadata"></audio>
      <button class="icon-btn" id="attachClose" type="button" title="Close player" aria-label="Close player"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>

    <script type="module" src="/src/pages/transcript.js"></script>
  </body>
</html>
