<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04050d" />
    <meta name="robots" content="noindex" />
    <meta name="application-name" content="SparkScribe" />
    <title>Transcript — SparkScribe</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg-grid"></div><div class="bg-glow bg-glow-a"></div><div class="bg-glow bg-glow-b"></div><div class="bg-glow bg-glow-c"></div><div class="bg-noise"></div>
    </div>

    <header class="topbar">
      <a class="brand" href="/" aria-label="SparkScribe home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="brand-name">Spark<b>Scribe</b></span>
      </a>
      <div class="topbar-right"><div id="accountSlot"></div></div>
    </header>

    <main class="app">
      <a class="back-link" href="/library">← My Library</a>

      <section class="panel res-head" id="detailHead">
        <div class="res-title">
          <h2 id="tTitle">Loading…</h2>
          <div class="meta-chips" id="tMeta"></div>
        </div>
        <div class="res-actions hidden" id="tActions">
          <div class="btn-group">
            <button class="btn btn-ghost" id="copyBtn" type="button">Copy</button>
            <button class="btn btn-ghost" id="txtBtn" type="button">.txt</button>
          </div>
          <button class="btn btn-danger" id="deleteBtn" type="button">Delete</button>
        </div>
      </section>

      <section class="panel transcript-card">
        <div class="transcript" id="transcript"><div class="lib-skel"></div><div class="lib-skel"></div></div>
      </section>
    </main>

    <dialog class="confirm" id="confirmDlg">
      <form method="dialog">
        <h3>Delete this transcript?</h3>
        <p>It will be permanently removed from your library. This can't be undone.</p>
        <div class="confirm-actions">
          <button class="btn btn-ghost" value="cancel" type="submit">Cancel</button>
          <button class="btn btn-danger" value="delete" type="submit" id="confirmDelete">Delete permanently</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/pages/transcript.js"></script>
  </body>
</html>
