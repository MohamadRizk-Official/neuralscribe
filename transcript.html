<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04050d" />
    <meta name="robots" content="noindex" />
    <title>Transcript — NeuralScribe</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg-grid"></div><div class="bg-glow bg-glow-a"></div><div class="bg-glow bg-glow-b"></div><div class="bg-glow bg-glow-c"></div><div class="bg-noise"></div>
    </div>

    <header class="topbar">
      <a class="brand" href="/" aria-label="NeuralScribe home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="brand-name">Neural<b>Scribe</b></span>
      </a>
      <div class="topbar-right"><div id="accountSlot"></div></div>
    </header>

    <main class="app">
      <a class="back-link" href="/library">← My Library</a>

      <section class="panel res-head" id="detailHead">
        <div class="res-title">
          <h2 id="tTitle">Loading…</h2>
          <div class="meta-chips" id="tMeta"></div>
        </div>
        <div class="res-actions hidden" id="tActions">
          <label class="btn btn-ghost" id="attachBtn" title="Open the original audio from this device to play along. It is not uploaded.">
            Play along
            <input type="file" id="attachInput" accept="audio/*,video/*,.m4a,.mp3,.mp4,.wav,.ogg,.opus,.webm,.aac,.flac,.mov" hidden />
          </label>
          <div class="btn-group">
            <button class="btn btn-ghost" id="copyBtn" type="button">Copy</button>
            <button class="btn btn-ghost" id="txtBtn" type="button">.txt</button>
          </div>
          <button class="btn btn-danger" id="deleteBtn" type="button">Delete</button>
        </div>
      </section>

      <nav id="resTabs" aria-label="Result views"></nav>

      <section class="panel transcript-card" id="transcriptCard">
        <div class="view-toggle" role="group" aria-label="Transcript view" id="viewToggle">
          <button type="button" class="on" data-view="original" aria-pressed="true" title="Exactly as transcribed">Original</button>
          <button type="button" data-view="clean" aria-pressed="false" title="Easier to read: hesitations (um, uh) and repeated words removed. The original is kept.">Clean</button>
        </div>
        <div class="transcript" id="transcript"><div class="lib-skel"></div><div class="lib-skel"></div></div>
      </section>

      <div id="insightsHost" class="insights-host"></div>
    </main>

    <div class="attach-bar hidden" id="attachBar">
      <audio id="attachPlayer" controls preload="metadata"></audio>
      <button class="icon-btn" id="attachClose" type="button" title="Close player" aria-label="Close player"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>

    <dialog class="confirm" id="confirmDlg">
      <form method="dialog">
        <h3>Delete this transcript?</h3>
        <p>It will be permanently removed from your library. This can't be undone.</p>
        <div class="confirm-actions">
          <button class="btn btn-ghost" value="cancel" type="submit">Cancel</button>
          <button class="btn btn-danger" value="delete" type="submit" id="confirmDelete">Delete permanently</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/pages/transcript.js"></script>
  </body>
</html>
