<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04050d" />
    <meta name="robots" content="noindex" />
    <meta name="application-name" content="SparkScribe" />
    <title>Signing you in — SparkScribe</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg-grid"></div><div class="bg-glow bg-glow-a"></div><div class="bg-glow bg-glow-b"></div><div class="bg-noise"></div>
    </div>
    <header class="topbar">
      <a class="brand" href="/" aria-label="SparkScribe home">
        <svg class="brand-mark spark-mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false"><defs><linearGradient id="sparkGrad" gradientUnits="userSpaceOnUse" x1="2" y1="0" x2="38" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs><rect class="sb sb-o" x="2" y="14" width="4" height="12" rx="2"/><rect class="sb sb-i" x="9" y="9" width="4" height="22" rx="2"/><path class="sbolt" d="M22.8 1.5 16 21.4h4l-2.8 17.1 6.8-20.9h-4.2z"/><path class="sbolt-hi" d="M22.8 1.5 16 21.4h4l-2.8 17.1 6.8-20.9h-4.2z"/><rect class="sb sb-i" x="27" y="10" width="4" height="20" rx="2"/><rect class="sb sb-o" x="34" y="15" width="4" height="10" rx="2"/></svg>
        <span class="brand-name">Spark<b>Scribe</b></span>
      </a>
    </header>
    <main class="app">
      <section class="panel auth-card center" aria-live="polite">
        <div class="spinner" id="spinner" aria-hidden="true"></div>
        <h1 class="auth-title" id="cbTitle">Signing you in…</h1>
        <p class="auth-sub" id="cbText">One moment.</p>
        <a class="btn btn-primary btn-block hidden" id="cbBtn" href="/auth">Back to sign in</a>
      </section>
    </main>
    <script type="module" src="/src/pages/callback.js"></script>
  </body>
</html>
